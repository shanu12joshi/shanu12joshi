<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Shanu — Co-founder and CTO, LYNC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .name{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;font-weight:800}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .node{animation:pulse 3s ease-in-out infinite}
      .node:nth-child(2){animation-delay:.6s}.node:nth-child(3){animation-delay:1.2s}.node:nth-child(4){animation-delay:1.8s}.node:nth-child(5){animation-delay:2.4s}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .dash{stroke-dasharray:6 8;animation:flow 2.5s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-56}}
    </style>
  </defs>
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- chain graph on the right -->
  <g transform="translate(830,50)" stroke="url(#accent)" stroke-width="1.5" fill="none">
    <path class="dash" d="M40 80 L140 30 L240 80 L140 130 Z M140 30 L140 130 M40 80 L240 80"/>
  </g>
  <g transform="translate(830,50)" fill="#22d3ee">
    <circle class="node" cx="40" cy="80" r="6"/>
    <circle class="node" cx="140" cy="30" r="6"/>
    <circle class="node" cx="240" cy="80" r="6"/>
    <circle class="node" cx="140" cy="130" r="6"/>
    <circle class="node" cx="140" cy="80" r="9" fill="#a3e635"/>
  </g>

  <text x="60" y="72" class="t" font-size="16" fill="#22d3ee">~/shanu $ whoami</text>
  <text x="60" y="130" class="name" font-size="52" fill="#ffffff">Shanu</text>
  <text x="60" y="168" class="t" font-size="20" fill="#c7d2fe">Co-founder &amp; CTO @ LYNC  ·  web3 infra · quant trading · games</text>
  <text x="60" y="212" class="t" font-size="16" fill="#94a3b8">25M+ txns  ·  3.5M+ wallets  ·  1,000+ projects  ·  12+ chains<tspan class="cursor" fill="#a3e635"> █</tspan></text>
</svg>
